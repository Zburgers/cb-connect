name: Gate 5 mobile foundation qualification (isolated)

on:
  push:
    branches: [gate5/atlas-foundation]
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/contracts/**'
      - 'tsconfig.json'
      - '.github/workflows/mobile-foundation.yml'

permissions:
  contents: read

jobs:
  m1-mobile-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
      - name: Pin isolated npm 11 resolver (web Node20 unaffected)
        run: npm install --global npm@11.6.2 && npm --version
      - name: Confirm separate web/npm boundary and mobile toolchain
        run: |
          test "$(node -p 'process.versions.node')" = 22.16.0
          node -e 'const p=require("./package.json"); if (p.workspaces || p.scripts["mobile:build:android"]) process.exit(1)'
          test -s apps/mobile/package-lock.json # M1 isolated lockfile must be committed
      - name: Resolve Expo-recommended mobile patch versions (one-time lock refresh)
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Reproducible isolated mobile installation
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npm ls react react-native expo expo-router --depth=0
      - name: Export non-secret mobile lockfile for exact Git commit (one-time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/gate5/atlas-foundation'
        run: |
          echo G5_LOCK_BEGIN
          base64 -w 160 apps/mobile/package-lock.json | sed 's/^/G5LOCK:/'
          echo G5_LOCK_END
      - name: Test native TypeScript contract and export resolution
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm run test
          npx expo install --check
          npm run doctor
          npm run bundle:android

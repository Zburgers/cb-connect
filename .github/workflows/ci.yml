name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualify:
    name: Deterministic qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v20.19.1"
          test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record qualification build timestamp
        run: printf 'CB_CONNECT_BUILT_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Build application
        run: npm run build
        env:
          # Qualification is intentionally secret-free and its build output is
          # never promoted. These inert values prevent a local ignored env file
          # from becoming an accidental CI dependency.
          NEXT_PUBLIC_CONVEX_URL: https://qualification.convex.cloud
          NEXT_PUBLIC_CONVEX_SITE_URL: https://qualification.convex.site
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_qualification
          CB_CONNECT_COMMIT_SHA: ${{ github.sha }}
          CB_CONNECT_BUILD_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
          CB_CONNECT_COMPATIBILITY_VERSION: v1

      - name: Post-build typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Dependency policy
        run: npm audit --omit=dev

  authenticated-smoke:
    name: Authenticated release smoke
    needs: qualify
    runs-on: ubuntu-latest
    environment: cb-connect-auth-test
    concurrency:
      group: cb-connect-auth-test
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      CLERK_TEST_ENVIRONMENT_NAME: ${{ secrets.CLERK_TEST_ENVIRONMENT_NAME }}
      CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_TEST_FRONTEND_API_URL: ${{ secrets.CLERK_TEST_FRONTEND_API_URL }}
      CONVEX_TEST_DEPLOYMENT: ${{ secrets.CONVEX_TEST_DEPLOYMENT }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}
      NEXT_PUBLIC_TEST_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_TEST_CONVEX_URL }}
      NEXT_PUBLIC_TEST_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_TEST_CONVEX_SITE_URL }}
      CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_TEST_FRONTEND_API_URL }}
      CB_CONNECT_BACKEND_DEPLOYMENT: dev:hallowed-hummingbird-284
      CB_CONNECT_BACKEND_COMPATIBILITY_VERSION: v1
      CB_CONNECT_FIXTURE_CLEANUP_ENABLED: true
      CB_CONNECT_RELEASE_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure isolated auth artifact directory
        run: printf 'CB_CONNECT_RELEASE_AUTH_DIR=%s/cb-connect-release-auth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v20.19.1"
          test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure runner Chrome
        run: |
          set -euo pipefail
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          printf 'PLAYWRIGHT_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Record authenticated test backend deployment timestamp
        run: printf 'CB_CONNECT_BACKEND_DEPLOYED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Validate authenticated smoke deployment contract
        run: bash scripts/tests/release-smoke-workflow.test.sh

      - name: Preflight authenticated test Convex deploy key target
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONVEX_DEPLOY_KEY"
          identity_output="$RUNNER_TEMP/cb-connect-test-deploy-key-target.txt"
          npx convex run queries/system:getBackendIdentity '{}' > "$identity_output"
          node - "$identity_output" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          if (!text.includes('dev:hallowed-hummingbird-284')) {
            throw new Error('convex_test_deploy_key_target_failed');
          }
          NODE

      - name: Sync authenticated test Convex runtime config
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CONVEX_DEPLOY_KEY"
          test -n "$CONVEX_TEST_DEPLOYMENT"
          test "$CLERK_TEST_ENVIRONMENT_NAME" = "holy clerk"
          test "$CONVEX_TEST_DEPLOYMENT" = "dev:hallowed-hummingbird-284"
          test "$NEXT_PUBLIC_TEST_CONVEX_URL" = "https://hallowed-hummingbird-284.convex.cloud"
          test "$NEXT_PUBLIC_TEST_CONVEX_SITE_URL" = "https://hallowed-hummingbird-284.convex.site"
          test "$CLERK_TEST_FRONTEND_API_URL" = "https://holy-clam-29.clerk.accounts.dev"
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          umask 077
          node - "$env_file" <<'NODE'
          const fs = require('node:fs');
          const names = [
            'CLERK_FRONTEND_API_URL',
            'CB_CONNECT_BACKEND_DEPLOYMENT',
            'CB_CONNECT_BACKEND_COMPATIBILITY_VERSION',
            'CB_CONNECT_BACKEND_DEPLOYED_AT',
            'CB_CONNECT_FIXTURE_CLEANUP_ENABLED',
          ];
          const content = names
            .filter((name) => process.env[name])
            .map((name) => `${name}=${process.env[name]}`)
            .join('\n');
          fs.writeFileSync(process.argv[2], content ? `${content}\n` : '', {
            mode: 0o600,
          });
          NODE
          if [[ ! -s "$env_file" ]]; then
            echo "::error::Missing required authenticated test Convex runtime configuration"
            exit 1
          fi
          npx convex env set --from-file "$env_file" --force

      - name: Deploy authenticated test Convex backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          npx convex deploy --typecheck disable --codegen enable --message "cb-connect-auth-test $GITHUB_SHA"

      - name: Verify authenticated test Convex backend identity
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          identity_output="$RUNNER_TEMP/cb-connect-test-backend-identity.txt"
          npx convex run queries/system:getBackendIdentity '{}' > "$identity_output"
          node - "$identity_output" <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync(process.argv[2], 'utf8');
          const expectations = [
            'dev:hallowed-hummingbird-284',
            'v1',
            process.env.CB_CONNECT_BACKEND_DEPLOYED_AT,
          ];
          for (const expected of expectations) {
            if (!expected || !text.includes(expected)) {
              throw new Error('convex_test_identity_failed');
            }
          }
          NODE

      - name: Run authenticated release smoke
        shell: bash
        run: |
          set +e
          base_run_id="$CB_CONNECT_RELEASE_RUN_ID"
          status=0
          : > "$RUNNER_TEMP/cb-connect-release-smoke.log"
          for project in release-desktop release-mobile; do
            project_log="$RUNNER_TEMP/cb-connect-release-smoke-${project}.log"
            CB_CONNECT_RELEASE_RUN_ID="${base_run_id}-${project}" npx playwright test --config=playwright.release.config.ts e2e/release-smoke.spec.ts --project="$project" 2>&1 | tee "$project_log" | tee -a "$RUNNER_TEMP/cb-connect-release-smoke.log"
            project_status=${PIPESTATUS[0]}
            if (( project_status == 0 )) && grep -Eq '[1-9][0-9]* skipped' "$project_log"; then
              project_status=1
            fi
            if (( project_status != 0 )); then
              status="$project_status"
              break
            fi
          done
          printf '%s\n' "$status" > "$RUNNER_TEMP/cb-connect-release-smoke.status"
          exit "$status"

      - name: Create redacted failure artifact
        if: failure()
        shell: bash
        run: |
          status=1
          if [[ -f "$RUNNER_TEMP/cb-connect-release-smoke.status" ]]; then
            status="$(<"$RUNNER_TEMP/cb-connect-release-smoke.status")"
          fi
          bash scripts/redact-release-artifacts.sh "$RUNNER_TEMP/cb-connect-redacted-artifacts" "$status"

      - name: Upload redacted failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cb-connect-release-smoke-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/cb-connect-redacted-artifacts
          if-no-files-found: error
          retention-days: 7

  release-artifact:
    name: Production-configured immutable release
    needs: [qualify, authenticated-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CB_CONNECT_COMMIT_SHA: ${{ github.sha }}
      CB_CONNECT_BUILD_ID: run-${{ github.run_id }}-${{ github.run_attempt }}
      CB_CONNECT_COMPATIBILITY_VERSION: v1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v20.19.1"
          test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record release build timestamp
        run: printf 'CB_CONNECT_BUILT_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Validate production public build configuration
        run: |
          set -euo pipefail
          required=(
            NEXT_PUBLIC_CONVEX_URL
            NEXT_PUBLIC_CONVEX_SITE_URL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          )
          for name in "${required[@]}"; do
            test -n "${!name:-}"
          done
          [[ "$NEXT_PUBLIC_CONVEX_URL" == https://* ]]
          [[ "$NEXT_PUBLIC_CONVEX_SITE_URL" == https://* ]]
          [[ "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" == pk_* ]]

      - name: Build the production-configured release artifact
        run: npm run build

      - name: Package immutable standalone release
        run: |
          bash scripts/tests/package-release.test.sh
          bash scripts/package-release.sh "$RUNNER_TEMP/cb-connect-release"
          bash scripts/package-release.sh --verify "$RUNNER_TEMP/cb-connect-release/release-manifest.json"

      - name: Smoke packaged standalone runtime
        run: bash scripts/tests/standalone-runtime.test.sh

      - name: Upload immutable standalone release
        uses: actions/upload-artifact@v4
        with:
          name: cb-connect-release-${{ github.sha }}
          path: ${{ runner.temp }}/cb-connect-release
          if-no-files-found: error
          retention-days: 7

name: Gates 0-2 QA

on:
  pull_request:
    branches: [gate-1/trustworthy-cycle-facts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-qa:
    name: Isolated authenticated Gates 0-2 matrix
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'gate-2/four-phase-state-semantics'
    runs-on: ubuntu-latest
    environment: cb-connect-auth-test
    concurrency:
      group: cb-connect-gates-0-2-qa
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      CLERK_TEST_ENVIRONMENT_NAME: ${{ secrets.CLERK_TEST_ENVIRONMENT_NAME }}
      CLERK_TEST_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_TEST_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_TEST_PUBLISHABLE_KEY }}
      CLERK_TEST_FRONTEND_API_URL: ${{ secrets.CLERK_TEST_FRONTEND_API_URL }}
      CONVEX_TEST_DEPLOYMENT: ${{ secrets.CONVEX_TEST_DEPLOYMENT }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_TEST_DEPLOY_KEY }}
      CB_CONNECT_CONVEX_CREDENTIAL_CLASS: test
      NEXT_PUBLIC_TEST_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_TEST_CONVEX_URL }}
      NEXT_PUBLIC_TEST_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_TEST_CONVEX_SITE_URL }}
      CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_TEST_FRONTEND_API_URL }}
      CB_CONNECT_BACKEND_DEPLOYMENT: dev:hallowed-hummingbird-284
      CB_CONNECT_BACKEND_COMPATIBILITY_VERSION: v1
      CB_CONNECT_FIXTURE_CLEANUP_ENABLED: true
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v20.19.1"
          test "$(npm --version)" = "10.8.2"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Configure runner Chrome
        run: |
          set -euo pipefail
          browser_path="$(command -v google-chrome)"
          test -x "$browser_path"
          printf 'PLAYWRIGHT_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Record backend deployment timestamp
        run: printf 'CB_CONNECT_BACKEND_DEPLOYED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Deterministic preflight
        run: |
          set -euo pipefail
          npm run typecheck
          NEXT_PUBLIC_CONVEX_URL=https://example.invalid npm run build
          npm run test:unit -- --run
          npm audit --omit=dev
          git diff --check
          npm run test:convex-safe-exec
          npm run test:convex-command-policy
          npm run test:fixture-evidence-boundary
          npm run test:ci-workflow
          npm run test:cycle-facts-plan
          bash scripts/tests/release-smoke-workflow.test.sh
          bash scripts/tests/deploy-workflow.test.sh
          bash scripts/tests/cycle-state-copy.test.sh

      - name: Validate approved test target
        run: |
          set -euo pipefail
          test "$CONVEX_TEST_DEPLOYMENT" = "dev:hallowed-hummingbird-284"
          test "$CLERK_TEST_ENVIRONMENT_NAME" = "holy clerk"
          test -z "${CONVEX_DEPLOYMENT:-}"
          bash scripts/convex-safe-exec test -- run queries/system:getBackendIdentity '{}'

      - name: Sync test backend runtime metadata
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          umask 077
          cat > "$env_file" <<EOF
          CLERK_FRONTEND_API_URL=${CLERK_TEST_FRONTEND_API_URL}
          CB_CONNECT_BACKEND_DEPLOYMENT=dev:hallowed-hummingbird-284
          CB_CONNECT_BACKEND_COMPATIBILITY_VERSION=v1
          CB_CONNECT_BACKEND_DEPLOYED_AT=${CB_CONNECT_BACKEND_DEPLOYED_AT}
          CB_CONNECT_FIXTURE_CLEANUP_ENABLED=true
          EOF
          bash scripts/convex-safe-exec test -- env set --from-file "$env_file" --force

      - name: Deploy exact QA source to approved test backend
        run: |
          set -euo pipefail
          bash scripts/convex-safe-exec test -- deploy --typecheck disable --codegen enable --message "cb-connect-gates-0-2-qa ${GITHUB_SHA}"
          bash scripts/convex-safe-exec test -- run queries/system:getBackendIdentity '{}'

      - name: Run isolated authenticated matrix
        id: matrix
        run: |
          set -euo pipefail
          export CB_CONNECT_QA_EVIDENCE_DIR="$RUNNER_TEMP/cb-connect-gates-0-2-qa"
          export CB_CONNECT_QA_RUN_ID="qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/run-gates-0-2-qa.sh

      - name: Prepare redacted QA evidence
        if: always()
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/cb-connect-gates-0-2-qa"
          safe_root="$RUNNER_TEMP/cb-connect-gates-0-2-qa-redacted"
          mkdir -p "$safe_root"
          if [[ -f "$source_root/summary.tsv" ]]; then
            cp "$source_root/summary.tsv" "$safe_root/summary.tsv"
          fi
          if [[ -d "$source_root" ]]; then
            while IFS= read -r file; do
              relative="${file#${source_root}/}"
              destination="$safe_root/$relative"
              mkdir -p "$(dirname "$destination")"
              cp "$file" "$destination"
            done < <(find "$source_root" -type f \( -name 'lane.env' -o -name 'e2-live-proof.md' \))
          fi
          printf '%s\n' \
            "qualified_source_sha=${GITHUB_SHA}" \
            "approved_convex_target=dev:hallowed-hummingbird-284" \
            "approved_clerk_environment=holy clerk" \
            > "$safe_root/qualification.env"

      - name: Upload redacted QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-connect-gates-0-2-qa-${{ github.sha }}
          path: ${{ runner.temp }}/cb-connect-gates-0-2-qa-redacted
          if-no-files-found: error
          retention-days: 7

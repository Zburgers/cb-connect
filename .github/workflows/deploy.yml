name: Deploy cb-connect

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate required deployment configuration
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          CB_CONNECT_PRODUCTION_BASE_URL: ${{ secrets.CB_CONNECT_PRODUCTION_BASE_URL }}
          CB_CONNECT_PRODUCTION_DEPLOYMENT: ${{ vars.CB_CONNECT_PRODUCTION_DEPLOYMENT }}
        run: |
          set -euo pipefail
          required=(
            CONVEX_DEPLOYMENT
            NEXT_PUBLIC_CONVEX_URL
            NEXT_PUBLIC_CONVEX_SITE_URL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            CLERK_SECRET_KEY
            CLERK_FRONTEND_API_URL
            CORS_ALLOWED_ORIGINS
            CB_CONNECT_PRODUCTION_BASE_URL
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required production deployment secret: ${name}"
              exit 1
            fi
          done

          test "$CB_CONNECT_PRODUCTION_DEPLOYMENT" = 'prod:festive-malamute-715'
          [[ "$CB_CONNECT_PRODUCTION_BASE_URL" == https://* ]]

      - name: Sync Convex runtime secrets
        if: vars.DEPLOY_CONVEX == 'true'
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CB_CONNECT_BACKEND_DEPLOYMENT: ${{ vars.CB_CONNECT_PRODUCTION_DEPLOYMENT }}
          CB_CONNECT_BACKEND_COMPATIBILITY_VERSION: v1
          CB_CONNECT_BACKEND_DEPLOYED_AT: ${{ github.run_started_at }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          umask 077

          node - "$env_file" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const names = [
            'CLERK_FRONTEND_API_URL',
            'CLERK_WEBHOOK_SECRET',
            'DISCORD_WEBHOOK_URL',
            'CB_CONNECT_BACKEND_DEPLOYMENT',
            'CB_CONNECT_BACKEND_COMPATIBILITY_VERSION',
            'CB_CONNECT_BACKEND_DEPLOYED_AT',
          ];
          const content = names
            .filter((name) => process.env[name])
            .map((name) => `${name}=${process.env[name]}`)
            .join('\n');
          fs.writeFileSync(file, content ? `${content}\n` : '', { mode: 0o600 });
          NODE

          if [[ -s "$env_file" ]]; then
            convex_env_deployment="$CONVEX_DEPLOYMENT"
            if [[ "$convex_env_deployment" == prod:* ]]; then
              convex_env_deployment="${convex_env_deployment#prod:}"
            fi
            npx convex env set --from-file "$env_file" --deployment "$convex_env_deployment"
          else
            echo "Skipping Convex runtime secret sync; no optional values are configured."
          fi

      - name: Validate explicit Convex release target
        if: vars.DEPLOY_CONVEX == 'true'
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CB_CONNECT_PRODUCTION_DEPLOYMENT: ${{ vars.CB_CONNECT_PRODUCTION_DEPLOYMENT }}
        run: |
          set -euo pipefail
          expected='prod:festive-malamute-715'
          test "$CB_CONNECT_PRODUCTION_DEPLOYMENT" = "$expected"
          test "$CONVEX_DEPLOYMENT" = "$expected"

      - name: Deploy explicit Convex compatibility release
        if: vars.DEPLOY_CONVEX == 'true'
        env:
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
        run: |
          set -euo pipefail
          convex_release_env_file="$RUNNER_TEMP/cb-connect-convex-release.env"
          umask 077
          printf 'CONVEX_DEPLOYMENT=%s\n' "$CONVEX_DEPLOYMENT" > "$convex_release_env_file"
          npx convex deploy --env-file "$convex_release_env_file" --typecheck enable --codegen enable --message "cb-connect ${GITHUB_SHA}"
          npx convex function-spec --deployment "$CONVEX_DEPLOYMENT" > "$RUNNER_TEMP/cb-connect-convex-function-spec.json"
          rg -q 'getBackendIdentity' "$RUNNER_TEMP/cb-connect-convex-function-spec.json"
          npx convex run queries/system:getBackendIdentity '{}' --deployment "$CONVEX_DEPLOYMENT" > "$RUNNER_TEMP/cb-connect-backend-identity.json"
          rg -q '"compatibilityVersion"[[:space:]]*:[[:space:]]*"v1"' "$RUNNER_TEMP/cb-connect-backend-identity.json"

      - name: Validate Convex backend
        run: npm run test:unit -- --run

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          CB_CONNECT_COMMIT_SHA: ${{ github.sha }}
          CB_CONNECT_BUILD_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          CB_CONNECT_COMPATIBILITY_VERSION: v1
          CB_CONNECT_BUILT_AT: ${{ github.run_started_at }}

      - name: Validate PM2 promotion contract
        run: bash scripts/tests/pm2-config.test.sh

      - name: Package immutable standalone release
        env:
          CB_CONNECT_COMMIT_SHA: ${{ github.sha }}
          CB_CONNECT_BUILD_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          CB_CONNECT_COMPATIBILITY_VERSION: v1
          CB_CONNECT_BUILT_AT: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/cb-connect-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          extract_dir="$release_dir/extracted"
          mkdir -p "$extract_dir"
          bash scripts/package-release.sh "$release_dir"
          manifest="$release_dir/release-manifest.json"
          bash scripts/package-release.sh --verify "$manifest"
          artifact="$(node -e 'const fs=require("node:fs"); const path=require("node:path"); const m=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(path.join(path.dirname(process.argv[1]), m.artifact));' "$manifest")"
          tar -xzf "$artifact" -C "$extract_dir"
          test -f "$extract_dir/server.js"

      - name: Promote with PM2 start-or-reload
        run: |
          set -euo pipefail
          pm2 startOrReload pm2.config.js --update-env
          pm2 save
        env:
          NODE_ENV: production
          PORT: 6050
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
          CB_CONNECT_COMMIT_SHA: ${{ github.sha }}
          CB_CONNECT_BUILD_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
          CB_CONNECT_COMPATIBILITY_VERSION: v1
          CB_CONNECT_BUILT_AT: ${{ github.run_started_at }}
          CB_CONNECT_RELEASE_DIR: ${{ runner.temp }}/cb-connect-release-${{ github.run_id }}-${{ github.run_attempt }}/extracted

      - name: Verify compatible release promotion
        env:
          CB_CONNECT_PRODUCTION_BASE_URL: ${{ secrets.CB_CONNECT_PRODUCTION_BASE_URL }}
          CB_CONNECT_PRODUCTION_DEPLOYMENT: ${{ vars.CB_CONNECT_PRODUCTION_DEPLOYMENT }}
          CB_CONNECT_COMPATIBILITY_VERSION: v1
          PM2_PROCESS_NAME: cb-connect
          RELEASE_REQUIRE_TLS: true
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/cb-connect-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/release-manifest.json"
          bash scripts/verify-release.sh "$manifest" "$CB_CONNECT_PRODUCTION_BASE_URL" "$CB_CONNECT_PRODUCTION_DEPLOYMENT" "$CB_CONNECT_COMPATIBILITY_VERSION"

name: Deploy cb-connect

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Convex backend
        run: npm run test:unit -- --run

      - name: Deploy Convex backend
        run: npx convex deploy --typecheck enable --codegen enable --message "cb-connect ${GITHUB_SHA}"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_FRONTEND_API_URL: ${{ secrets.CLERK_FRONTEND_API_URL }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}

      - name: Restart with PM2
        run: |
          # Inject secret key into pm2.config.js
          sed -i 's|CLERK_SECRET_KEY: ""|CLERK_SECRET_KEY: "${{ secrets.CLERK_SECRET_KEY }}"|g' pm2.config.js
          sed -i 's|CONVEX_DEPLOYMENT: ""|CONVEX_DEPLOYMENT: "${{ secrets.CONVEX_DEPLOYMENT }}"|g' pm2.config.js
          pm2 delete cb-connect || true
          pm2 start pm2.config.js
          pm2 save
